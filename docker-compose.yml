# Local stack. Only locally built images; nothing is pulled at runtime besides the pinned bases.
services:
  app:
    build:
      context: .
    image: taint-flow-agent:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENVIRONMENT: prod
      APP_LOG_LEVEL: INFO
      # Comma-separated SHA-256 digests; generate with `uv run taint-flow-agent generate-api-key`.
      APP_API_KEY_SHA256: ${APP_API_KEY_SHA256:-}
      # The deny-by-default sink policy; /readyz fails if it is missing or invalid.
      APP_POLICY_PATH: /app/policies/default.yaml
      # Declassification requests and the hash-chained audit log (tmpfs: the rootfs is read-only).
      APP_DATA_DIR: /tmp/var
      # Only the optional `bench/record.py` needs this; the service itself runs offline.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
